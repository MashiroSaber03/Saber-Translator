# Scorecard checklist: workspace and UI (#217). The "settings that do nothing" count comes from
# the prefs audit (#204), not from here.
# Statuses must be true on main. Verified against 4b53f62 on 2026-10-05.
area = "ui"
title = "Workspace and UI"
order = 4

[[item]]
id = "UI-217-1"
target = "Tool options, last Export As / Save for Web / Fill settings and font recents persist"
status = "partial"
issue = 217
note = "Fill (fill_ui.rs:72) and Liquify (liquify_ui.rs:64, #418) keep their settings in Preferences (prefs.dialogs); no tool_options/export fields in Preferences; export_dialog.rs:21 png/85. Each painting tool keeps its own brush (paint_mouse.rs sync_tool_brush, #218), but those live in UiState, so they are lost at quit like the other tool options"

[[item]]
id = "UI-217-2"
target = "Window size and dock width remembered across restarts"
status = "done"
issue = 217
note = "eframe persistence (ui.ron): persist_window for the window, egui memory for the dock panel width; window_and_panel_geometry_survive_a_restart asserts the round trip (apps/photocraft/src/main.rs; b07a2e5b, #587)"

[[item]]
id = "UI-217-3"
target = "File > Open starts in the last-used folder"
status = "done"
issue = 217
note = "file_dialog.rs last_used_dir: open dialogs ask with initial_dir (the most recent file's folder) and apps services.rs passes it to rfd set_directory; open_starts_in_the_last_used_folder + last_used_dir_takes_the_most_recent_parent"

