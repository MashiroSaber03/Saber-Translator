# ============================================================================
# Saber-Translator 自动构建与发布工作流
# ============================================================================
# 触发方式:
#   1. 在要发布的提交上推送版本标签:
#      git tag v3.3.0
#      git push origin v3.3.0
#   2. 手动触发: GitHub Actions 页面 -> 选择要发布的分支 -> Run workflow
#
# 流程:
#   1. 先创建 Draft Release
#   2. 并行构建 CPU 和 GPU 版本，每个直接上传到 Release
#   3. 等待手动编辑更新日志后发布
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不带v前缀，如 3.3.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  MODELS_RELEASE_TAG: models-storage
  PYTHON_VERSION: '3.12'
  PIP_NO_CACHE_DIR: '1'

jobs:
  # ============================================================================
  # 准备 Job - 先创建 Draft Release
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Verify release guard
        run: node --test .github/scripts/prepare_release.test.cjs

      - name: Get extension version
        id: extension
        run: |
          version=$(jq -er .version browser-extension/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="$REF_NAME"
            VERSION="${TAG_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION, Tag: $TAG_NAME"

      - name: Verify release target
        id: release_target
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.TAG_NAME }}
        with:
          script: |
            await require('./.github/scripts/prepare_release.cjs')({github, context, core});

      - name: Create Draft Release
        if: steps.release_target.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## Saber-Translator v${{ steps.version.outputs.VERSION }}
            
            > ⚠️ **构建中...请等待 CPU 和 GPU 版本上传完成后再发布。**
            
            ### 更新日志
            
            <!-- 请在此处填写更新日志 -->
            
            ---
            
            ### 下载说明
            
            📦 **普通用户（开箱即用）：**
            - CPU 版本：下载所有 `Saber-Translator-${{ steps.version.outputs.VERSION }}-cpu.7z*` 文件
            - GPU 版本：下载所有 `Saber-Translator-${{ steps.version.outputs.VERSION }}-gpu.7z*` 文件
            - 将所有分卷放在同一目录，使用 **7-Zip** 或 **Bandzip** 解压 `.7z.001` 文件即可
            - 浏览器漫画翻译：下载 `saber-translator-browser-extension-v${{ steps.extension.outputs.version }}.zip` 和对应 `.sha256` 文件，按 ZIP 内 README 安装
            
            🔧 **源码部署用户：**
            - 下载所有 `models.z*` 分卷并放在同一目录，从 `models.zip` 解压到项目根目录，得到 `models/` 文件夹
            
            > ⚠️ 程序包采用 7z 分卷压缩格式，请使用 [7-Zip](https://www.7-zip.org/) 或 [Bandzip](https://www.bandisoft.com/bandizip/) 解压，Windows 内置解压和 WinRAR 可能无法正确识别
          draft: true
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 构建 Job - CPU 和 GPU 并行构建，直接上传到 Release
  # ============================================================================
  build:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            requirements: requirements-cpu.txt
          - variant: gpu
            requirements: requirements-gpu.txt

    steps:
      # --------------------------------------------------
      # 1. 检出代码
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 从 models-storage Release 下载模型文件
      # --------------------------------------------------
      - name: Prepare build disk
        run: |
          # This hosted runner does not need the preinstalled Android SDK.
          $androidSdk = 'C:\Android\android-sdk'
          if (Test-Path -LiteralPath $androidSdk) {
            $resolvedSdk = (Resolve-Path -LiteralPath $androidSdk).Path
            if ($resolvedSdk -ne $androidSdk) { throw 'Unexpected Android SDK path' }
            Remove-Item -LiteralPath $resolvedSdk -Recurse -Force
          }
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0, 1))
          Write-Host ("Available disk: {0:N1} GiB" -f ($drive.Free / 1GB))
          if ($drive.Free -lt 25GB) { throw 'Packaging needs at least 25 GiB free disk space.' }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download models from storage release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "Downloading models from release: ${{ env.MODELS_RELEASE_TAG }}"
          gh release download ${{ env.MODELS_RELEASE_TAG }} --pattern "models.z*" --dir .
          
          Write-Host "Downloaded files:"
          Get-ChildItem -Filter "models.z*" | Format-Table Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}

      # --------------------------------------------------
      # 3. 解压模型文件
      # --------------------------------------------------
      - name: Extract models
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "Extracting models..."
          7z x models.zip -y
          
          Write-Host "Models extracted. Directory contents:"
          Get-ChildItem -Path models/ | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}

      - name: Verify required model files
        run: python .github/scripts/check_models.py models

      - name: Upload models to draft
        if: matrix.variant == 'cpu'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upload_release_assets.py "${{ needs.prepare.outputs.tag_name }}" . "models.z*"

      # --------------------------------------------------
      # 4. 清理模型压缩包（节省磁盘空间）
      # --------------------------------------------------
      - name: Clean up model archives
        run: |
          Write-Host "Cleaning up model archives to save disk space..."
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          Get-ChildItem -LiteralPath $workspace -Filter 'models.z*' -File | Remove-Item -Force

      # --------------------------------------------------
      # 6. 安装依赖 (CPU 和 GPU 流程不同)
      # --------------------------------------------------
      - name: Install dependencies
        env:
          TORCH_VARIANT: ${{ matrix.variant == 'gpu' && 'cu130' || 'cpu' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.0+$env:TORCH_VARIANT" "torchvision==0.26.0+$env:TORCH_VARIANT" --index-url "https://download.pytorch.org/whl/$env:TORCH_VARIANT"
          python -m pip install -r ${{ matrix.requirements }}
          if ($env:TORCH_VARIANT -eq 'cu130') {
            python -m pip install --force-reinstall --no-deps "onnxruntime-gpu>=1.27,<2"
          }
          python -c "import os, torch, torchvision; variant = os.environ['TORCH_VARIANT']; assert torch.__version__ == '2.11.0+' + variant, torch.__version__; assert torchvision.__version__ == '0.26.0+' + variant, torchvision.__version__; assert torch.version.cuda == ('13.0' if variant == 'cu130' else None); print('Verified PyTorch:', torch.__version__)"

      # --------------------------------------------------
      # 7. 构建并校验 v2 Web 前端
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            vue-frontend/package-lock.json
            browser-extension/package-lock.json

      - name: Build v2 frontend
        working-directory: vue-frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run check:api
          npm run build:check

      - name: Verify generated frontend is current
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $changes = @(git status --porcelain -- src/backend_v2/static/vue)
          if ($changes.Count -ne 0) {
            $changes | Write-Host
            throw "Frontend build changed generated static assets"
          }

      - name: Verify backend contracts
        if: matrix.variant == 'cpu'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "pytest>=8.4,<9"
          python -m pytest tests_backend -q

      - name: Verify frontend unit tests
        if: matrix.variant == 'cpu'
        working-directory: vue-frontend
        run: npm test

      - name: Verify frontend lint
        if: matrix.variant == 'cpu'
        working-directory: vue-frontend
        run: npm run lint

      - name: Verify frontend styles
        if: matrix.variant == 'cpu'
        working-directory: vue-frontend
        run: npm run lint:css

      - name: Verify frontend architecture
        if: matrix.variant == 'cpu'
        working-directory: vue-frontend
        run: npm run lint:ui:audit

      - name: Verify and package browser extension
        if: matrix.variant == 'cpu'
        working-directory: browser-extension
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test
          npm run typecheck
          npm run package

      # --------------------------------------------------
      # 8. 使用 PyInstaller 打包
      # --------------------------------------------------
      - name: Build with PyInstaller
        env:
          SABER_BUILD_MOVE_MODELS: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "Building with PyInstaller..."
          pyinstaller app.spec --noconfirm
          
          Write-Host "Build completed. Output directory:"
          Get-ChildItem -Path dist/ | Select-Object Name

      # --------------------------------------------------
      # 9. 验证 TorchScript 所需源码文件已随包生成
      # --------------------------------------------------
      - name: Verify TorchScript source files
        run: |
          $requiredFiles = @(
            "dist\Saber-Translator\_internal\litelama\litelama.py",
            "dist\Saber-Translator\_internal\kornia\geometry\epipolar\_metrics.py"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Host "Missing required TorchScript source file: $file"
              exit 1
            }
            Write-Host "Verified source file: $file"
          }

      - name: Probe packaged runtime
        run: python .github/scripts/probe_package.py dist/Saber-Translator/Saber-Translator.exe

      - name: Verify bundled model files
        run: python .github/scripts/check_models.py dist/Saber-Translator/_internal/models

      # --------------------------------------------------
      # 10. 7z 分卷压缩（最高压缩率）
      # --------------------------------------------------
      - name: Package with 7z split (ultra compression)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ needs.prepare.outputs.version }}"
          $variant = "${{ matrix.variant }}"
          $outputName = "Saber-Translator-$version-$variant"
          
          Write-Host "Compressing with 7z format... Output: $outputName.7z (split at 1900MB)"
          
          Push-Location dist
          
          # -t7z: 7z native format (better compatibility than ZIP split)
          # -mx=9: Maximum compression level
          # -mfb=258: Maximum FastBytes
          # -v1900m: Split at 1900MB
          7z a -t7z -mx=9 -mfb=258 -v1900m "../$outputName.7z" "Saber-Translator/*"
          
          Pop-Location
          
          Write-Host "Compression completed. Generated files:"
          Get-ChildItem "$outputName.7z*" | Format-Table Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}

      # --------------------------------------------------
      # 11. 验证压缩文件
      # --------------------------------------------------
      - name: Verify compressed archives
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ needs.prepare.outputs.version }}"
          $variant = "${{ matrix.variant }}"
          $baseName = "Saber-Translator-$version-$variant"
          
          Write-Host "Verifying compressed archives..."
          
          # List all generated 7z split files
          $files = Get-ChildItem "$baseName.7z*" | Sort-Object Name
          
          Write-Host "Generated $($files.Count) archive file(s):"
          $files | Format-Table Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}
          
          # Verify the first split file (7z will check all parts)
          $firstFile = $files | Select-Object -First 1
          Write-Host "Testing archive integrity: $($firstFile.Name)"
          7z t $firstFile.FullName
          
          Write-Host "Archive verification passed!"

      # --------------------------------------------------
      # 12. 直接上传到 Release（不通过 artifacts）
      # --------------------------------------------------
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upload_release_assets.py "${{ needs.prepare.outputs.tag_name }}" . "Saber-Translator-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.7z*"

      - name: Upload browser extension to Release
        if: matrix.variant == 'cpu'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upload_release_assets.py "${{ needs.prepare.outputs.tag_name }}" browser-extension/release "saber-translator-*.zip*"

  # ============================================================================
  # 完成 Job - 输出结果
  # ============================================================================
  complete:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "=========================================="
          echo "Build and Release Summary"
          echo "=========================================="
          echo ""
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Tag: ${{ needs.prepare.outputs.tag_name }}"
          echo "Build result: ${{ needs.build.result }}"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "Next steps:"
            echo "  1. Go to GitHub Releases page"
            echo "  2. Edit the draft release v${{ needs.prepare.outputs.version }}"
            echo "  3. Write your changelog"
            echo "  4. Click 'Publish release'"
          else
            echo "The build failed or was cancelled. Keep the release as a draft and inspect the failed job."
          fi
          echo ""
          echo "Link: https://github.com/${{ github.repository }}/releases"
