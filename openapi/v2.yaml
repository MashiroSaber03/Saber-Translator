      schema:
        $ref: "#/components/schemas/Uuid"
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BookId:
      name: book_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ChapterId:
      name: chapter_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    LeaseId:
