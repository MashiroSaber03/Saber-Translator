openapi: 3.1.0
info:
  title: Saber Translator Backend-First API
  version: 2.0.0-dev
  description: >-
    Contract-first API for the backend-owned v2 architecture. This document is
    intentionally introduced before v2 feature handlers.
servers:
  - url: /api/v2
tags:
  - name: system
  - name: settings
  - name: content
  - name: pages
  - name: operations
  - name: jobs
  - name: studio
  - name: plugins
  - name: plugin-agent
paths:
  /health:
    get:
      tags: [system]
      operationId: getV2Health
      responses:
        "200":
          description: Process health and epoch identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /system/server-info:
    get:
      tags: [system]
      operationId: getServerInfo
      responses:
        "200":
          description: LAN address advertised by the single local API instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      parameters:
        - name: domains
          in: query
          schema: {type: string}
        - name: book_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Backend-authoritative settings and credential summaries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsDocument"}
  /provider-settings:
    get:
      tags: [settings]
      operationId: getProviderSettings
      parameters:
        - name: domains
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Provider configuration memories without secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ProviderSettingEntry"}
  /credentials:
    get:
      tags: [settings]
      operationId: listCredentials
      responses:
        "200":
          description: Secret-free credential summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CredentialSummary"}
  /credentials/{credential_id}:
    delete:
      tags: [settings]
      operationId: deleteCredential
      parameters:
        - name: credential_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Credential deleted when no history references it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "404": {$ref: "#/components/responses/NotFound"}
  /settings/transactions:
    put:
      tags: [settings]
      operationId: saveSettingsTransaction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingsTransaction"}
      responses:
        "200":
          description: All settings, provider memories, and credentials committed atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsTransactionResult"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /settings/workflow-preferences:
    patch:
      tags: [settings]
      operationId: updateWorkflowPreferences
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload, baseRevision]
              properties:
                payload: {type: object, additionalProperties: true}
                baseRevision: {type: integer, minimum: 0}
      responses:
        "200":
          description: Workflow preference setting after revision CAS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingEntry"}
        "409": {$ref: "#/components/responses/Conflict"}
  /prompts:
    get:
      tags: [settings]
      operationId: listPrompts
      parameters:
        - name: type
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Unified prompt library.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptList"}
    post:
      tags: [settings]
      operationId: createPrompt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name, content]
              properties:
                type: {type: string}
                name: {type: string, minLength: 1}
                content: {type: string}
      responses:
        "201":
          description: Prompt created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResource"}
        "409": {$ref: "#/components/responses/Conflict"}
  /prompts/{prompt_id}:
    put:
      tags: [settings]
      operationId: updatePrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, content, baseRevision]
              properties:
                name: {type: string, minLength: 1}
                content: {type: string}
                baseRevision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Prompt updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResource"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [settings]
      operationId: deletePrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Non-factory prompt deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
  /prompts/{prompt_id}/reset:
    post:
      tags: [settings]
      operationId: resetPrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baseRevision]
              properties:
                baseRevision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Factory prompt reset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResource"}
  /model-catalog:
    post:
      tags: [settings]
      operationId: fetchModelCatalog
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderDiagnosticRequest"}
      responses:
        "200":
          description: Provider model catalog; result is not persisted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelCatalogResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /connection-tests/{kind}:
    post:
      tags: [settings]
      operationId: runConnectionTest
      x-command-mode: transient
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - ollama
              - sakura
              - lama_repair
              - baidu_ocr
              - ai_vision_ocr
              - baidu_translate
              - youdao_translate
              - ai_translate
              - firecrawl
              - web_import_agent
              - vlm
              - llm
              - embedding
              - reranker
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderDiagnosticRequest"}
      responses:
        "200":
          description: Transient connection result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionTestResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /fonts:
    get:
      tags: [settings]
      operationId: listFonts
      responses:
        "200":
          description: Built-in and uploaded backend fonts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FontList"}
    post:
      tags: [settings]
      operationId: uploadFont
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
                displayName: {type: string}
      responses:
        "201":
          description: Immutable font asset registered.
          content:
            application/json:
              schema:
                type: object
                required: [id, assetUrl]
                properties:
                  id: {$ref: "#/components/schemas/Uuid"}
                  assetUrl: {type: string}
        "422": {$ref: "#/components/responses/ValidationError"}
  /fonts/{font_id}:
    delete:
      tags: [settings]
      operationId: deleteFont
      parameters:
        - name: font_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unreferenced uploaded font deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
  /maintenance/clean-temp:
    post:
      tags: [settings]
      operationId: cleanTemporaryAssets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Asset journal recovery result.
          content:
            application/json:
              schema:
                type: object
                required: [recovered]
                properties:
                  recovered: {type: integer, minimum: 0}
  /maintenance/clean-debug:
    post:
      tags: [settings]
      operationId: cleanDebugAssets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Debug asset cleanup result.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: {type: integer, minimum: 0}
  /pages/{page_id}/document/batch:
    patch:
      tags: [pages]
      operationId: batchMutatePageDocument
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageDocumentBatchMutation"
      responses:
        "200":
          description: The complete authoritative page document after one CAS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageDocument"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "422":
          $ref: "#/components/responses/ValidationError"
  /pages/{page_id}/repairs:
    post:
      tags: [operations]
      operationId: createPageRepairOperation
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BubbleRepairCommand"
                - $ref: "#/components/schemas/MaskRepairWithFillCommand"
                - $ref: "#/components/schemas/MaskRestoreCommand"
      responses:
        "202":
          description: Repair operation was durably created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "422":
          $ref: "#/components/responses/ValidationError"
  /operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Current durable operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/NotFound"
  /operations/{operation_id}/events:
    get:
      tags: [operations]
      operationId: getOperationEvents
      description: >-
        Returns durable catch-up events as JSON, or an SSE stream when the
        client sends Accept: text/event-stream or stream=1.
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - name: after
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: stream
          in: query
          schema: {type: integer, enum: [0, 1], default: 0}
      responses:
        "200":
          description: Operation events or an event stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationEventList"}
            text/event-stream:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/NotFound"
  /pages/{page_id}/operations:
    post:
      tags: [operations]
      operationId: createPageOperation
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageOperationCommand"
      responses:
        "202":
          description: The operation was committed before returning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "422":
          $ref: "#/components/responses/ValidationError"
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      parameters:
        - name: scope
          in: query
          schema: {type: string, enum: [queue, history], default: queue}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/JobStatus"}
        - name: type
          in: query
          schema: {$ref: "#/components/schemas/JobKind"}
        - name: book_id
          in: query
          schema: {$ref: "#/components/schemas/Uuid"}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 200}
      responses:
        "200":
          description: Durable queue or retained history snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
  /jobs/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: integer, minimum: 0}
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: One global resumable SSE stream for all job consumers.
          content:
            text/event-stream:
              schema: {type: string}
  /jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job, item, step, checkpoint and error details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{job_id}/events:
    get:
      tags: [jobs]
      operationId: listJobEvents
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        "200":
          description: Durable key-event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventList"
  /jobs/{job_id}/pause:
    post:
      tags: [jobs]
      operationId: pauseRunningJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Pause intent accepted or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "409":
          $ref: "#/components/responses/InvalidTransition"
  /jobs/{job_id}/resume:
    post:
      tags: [jobs]
      operationId: resumePausedJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: A paused job was returned to queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/InvalidTransition"
  /jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancel intent accepted or the queued job cancelled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "409":
          $ref: "#/components/responses/InvalidTransition"
  /jobs/reorder:
    post:
      tags: [jobs]
      operationId: reorderJobs
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobReorderCommand"}
      responses:
        "200":
          description: Updated queue revision.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [queueRevision]
                properties:
                  queueRevision: {type: integer, minimum: 1}
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/cancel-queued:
    post:
      tags: [jobs]
      operationId: cancelQueuedJobs
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: All currently queued jobs were atomically cancelled.
  /jobs/history/clear:
    post:
      tags: [jobs]
      operationId: clearJobHistory
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Terminal history removed; interrupted jobs are retained.
  /job-batches/{batch_id}:
    get:
      tags: [jobs]
      operationId: getJobBatch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Batch summary and member jobs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobBatch"}
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{job_id}/continue:
    post:
      tags: [jobs]
      operationId: continueInterruptedJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: An interrupted job was returned to queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          $ref: "#/components/responses/InvalidTransition"
  /studio/books/{book_id}/index:
    get:
      tags: [studio]
      operationId: getStudioIndex
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Studio document summaries and candidate availability.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioIndex"}
  /studio/books/{book_id}/candidates:
    get:
      tags: [studio]
      operationId: getStudioCandidates
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Enhanced-timeline character candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioCandidateList"
  /studio/books/{book_id}/documents:
    post:
      tags: [studio]
      operationId: createStudioDocument
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Created canonical Studio document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioDocument"}
  /studio/books/{book_id}/imports:
    post:
      tags: [studio]
      operationId: importStudioDocument
      description: Imports v2/v3 JSON, metadata PNG, or an ordinary avatar image.
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/FileUpload"}
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Imported canonical Studio document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioDocument"}
  /studio/assets:
    post:
      tags: [studio]
      operationId: uploadStudioAsset
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/FileUpload"}
      responses:
        "201":
          description: Validated immutable image asset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioAsset"}
  /studio/documents/{document_id}:
    get:
      tags: [studio]
      operationId: getStudioDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Canonical document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioDocument"}
    put:
      tags: [studio]
      operationId: updateStudioDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioDocumentMutation"}
      responses:
        "200":
          description: Document saved with revision CAS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioDocument"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [studio]
      operationId: deleteStudioDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": {description: Document deleted.}
        "423": {$ref: "#/components/responses/Locked"}
  /studio/documents/{document_id}/avatar:
    post:
      tags: [studio]
      operationId: setStudioAvatar
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/FileUpload"
                - type: object
                  required: [baseRevision]
                  properties:
                    baseRevision: {type: integer, minimum: 1}
      responses:
        "201":
          description: Avatar bound with document revision CAS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioDocument"}
    delete:
      tags: [studio]
      operationId: clearStudioAvatar
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: baseRevision
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Avatar reference cleared.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudioDocument"}
  /studio/documents/{document_id}/generate:
    post:
      tags: [studio]
      operationId: generateStudioDocumentSection
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudioGenerateCommand"}
      responses:
        "202":
          description: Saved generation operation created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationAccepted"}
        "409": {$ref: "#/components/responses/Conflict"}
        "423": {$ref: "#/components/responses/Locked"}
