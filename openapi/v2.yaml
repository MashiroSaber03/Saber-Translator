openapi: 3.1.0
info:
  title: Saber Translator Backend-First API
  version: 2.0.0-dev
  description: >-
    Complete HTTP contract for the backend-owned v2 architecture. Runtime
    route coverage and generated frontend types are verified against this file.
servers:
  - url: /api/v2
tags:
  - name: system
  - name: auth
  - name: admin
  - name: settings
  - name: content
  - name: pages
  - name: operations
  - name: jobs
  - name: insight
  - name: web-import
  - name: transfer
  - name: studio
  - name: plugins
  - name: plugin-agent
paths:
  /health:
    get:
      tags: [system]
      operationId: getV2Health
      responses:
        "200":
          description: Process health and epoch identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /system/capabilities:
    get:
      tags: [system]
      operationId: getRuntimeCapabilities
      responses:
        "200":
          description: Fixed capabilities for the selected runtime profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RuntimeCapabilities"}
  /auth/register:
    post:
      tags: [auth]
      operationId: registerAccount
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterCommand"}
      responses:
        "200":
          description: Account session and one-time recovery codes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /auth/login:
    post:
      tags: [auth]
      operationId: loginAccount
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginCommand"}
      responses:
        "200":
          description: Authenticated browser session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/NotFound"}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logoutAccount
      x-command-mode: transient
      responses:
        "200":
          description: Browser session deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusResponse"}
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentAccount
      responses:
        "200":
          description: Current account and effective asset quota.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
  /auth/recover:
    post:
      tags: [auth]
      operationId: recoverAccount
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoverCommand"}
      responses:
        "200":
          description: Password reset and existing sessions revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusResponse"}
        "401": {$ref: "#/components/responses/NotFound"}
  /auth/change-password:
    post:
      tags: [auth]
      operationId: changeAccountPassword
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordCommand"}
      responses:
        "200":
          description: Password changed and all sessions revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusResponse"}
  /browser-credentials/{domain}/{provider}:
    parameters:
      - name: domain
        in: path
        required: true
        schema: {type: string, pattern: "^[A-Za-z0-9_.-]{1,96}$"}
      - name: provider
        in: path
        required: true
        schema: {type: string, pattern: "^[A-Za-z0-9_.-]{1,96}$"}
    put:
      tags: [auth]
      operationId: loadBrowserCredentialLease
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowserCredentialCommand"}
      responses:
        "200":
          description: Credential loaded into launcher memory.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserCredentialLoaded"}
    delete:
      tags: [auth]
      operationId: deleteBrowserCredentialLease
      x-command-mode: transient
      responses:
        "200":
          description: In-memory credential lease removed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusResponse"}
  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      responses:
        "200":
          description: Accounts with asset usage, effective quotas, and retained task activity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUserList"}
  /admin/users/{user_id}/status:
    patch:
      tags: [admin]
      operationId: setAdminUserStatus
      x-command-mode: transient
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminStatusCommand"}
      responses:
        "200":
          description: Account status updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusResponse"}
  /admin/asset-quota:
    get:
      tags: [admin]
      operationId: getAssetQuota
      responses:
        "200":
          description: Per-user asset quota shared by all accounts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetQuota"}
    patch:
      tags: [admin]
      operationId: setAssetQuota
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminQuotaCommand"}
      responses:
        "200":
          description: Updated per-user asset quota shared by all accounts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetQuota"}
  /admin/registration-policy:
    get:
      tags: [admin]
      operationId: getRegistrationPolicy
      responses:
        "200":
          description: Whether new accounts must provide an invite code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationPolicy"}
    patch:
      tags: [admin]
      operationId: setRegistrationPolicy
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationPolicy"}
      responses:
        "200":
          description: Updated registration policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationPolicy"}
  /admin/public-user-policy:
    get:
      tags: [admin]
      operationId: getPublicUserPolicy
      responses:
        "200":
          description: Feature, local-model, and performance policy for ordinary public users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicUserPolicy"}
    patch:
      tags: [admin]
      operationId: setPublicUserPolicy
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublicUserPolicy"}
      responses:
        "200":
          description: Updated public-user policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicUserPolicy"}
  /admin/scheduling-policy:
    get:
      tags: [admin]
      operationId: getSchedulingPolicy
      responses:
        "200":
          description: Current scheduling policy and live queue snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulingOverview"}
    patch:
      tags: [admin]
      operationId: setSchedulingPolicy
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SchedulingPolicy"}
      responses:
        "200":
          description: Updated scheduling policy and live queue snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulingOverview"}
  /admin/invites:
    get:
      tags: [admin]
      operationId: listAdminInvites
      responses:
        "200":
          description: Invite audit list without raw invite secrets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminInviteList"}
    post:
      tags: [admin]
      operationId: createAdminInvite
      x-command-mode: transient
      responses:
        "201":
          description: New one-time invite code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminInviteCreated"}
  /admin/invites/{invite_id}:
    delete:
      tags: [admin]
      operationId: revokeAdminInvite
      x-command-mode: transient
      parameters:
        - name: invite_id
          in: path
          required: true
          schema: {type: string, minLength: 12, maxLength: 12}
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusResponse"}
  /admin/users/{user_id}/recovery-code:
    post:
      tags: [admin]
      operationId: createAdminUserRecoveryCode
      x-command-mode: transient
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: One-time recovery code shown only in this response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryCodeCreated"}
  /system/server-info:
    get:
      tags: [system]
      operationId: getServerInfo
      responses:
        "200":
          description: LAN address advertised by the single local API instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
  /system/release-models:
    post:
      tags: [system]
      operationId: releaseWorkerModelCache
      x-command-mode: transient
      responses:
        "202":
          description: Model release was accepted for the Worker safe point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCommandAccepted"
        "409":
          description: A local model inference is currently running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      parameters:
        - name: domains
          in: query
          schema: {type: string}
        - name: book_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Backend-authoritative settings and credential summaries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsDocument"}
  /credentials/{credential_id}:
    delete:
      tags: [settings]
      operationId: deleteCredential
      parameters:
        - name: credential_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Credential deleted when no history references it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
        "404": {$ref: "#/components/responses/NotFound"}
  /settings/transactions:
    put:
      tags: [settings]
      operationId: saveSettingsTransaction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingsTransaction"}
      responses:
        "200":
          description: All settings, provider memories, credentials, and prompt edits committed atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsTransactionResult"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /settings/workflow-preferences:
    patch:
      tags: [settings]
      operationId: updateWorkflowPreferences
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload, baseRevision]
              properties:
                payload: {$ref: "#/components/schemas/WorkflowPreferences"}
                baseRevision: {type: integer, minimum: 0}
      responses:
        "200":
          description: Workflow preference setting after revision CAS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingEntry"}
        "409": {$ref: "#/components/responses/Conflict"}
  /prompts:
    get:
      tags: [settings]
      operationId: listPrompts
      parameters:
        - name: type
          in: query
          schema: {$ref: "#/components/schemas/PromptType"}
      responses:
        "200":
          description: Unified prompt library.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptList"}
    post:
      tags: [settings]
      operationId: createPrompt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, name, content]
              properties:
                type: {$ref: "#/components/schemas/PromptType"}
                name: {type: string, minLength: 1}
                content: {type: string}
      responses:
        "201":
          description: Prompt created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResource"}
        "409": {$ref: "#/components/responses/Conflict"}
  /prompts/{prompt_id}:
    put:
      tags: [settings]
      operationId: updatePrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, content, baseRevision]
              properties:
                name: {type: string, minLength: 1}
                content: {type: string}
                baseRevision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Prompt updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResource"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [settings]
      operationId: deletePrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Non-factory prompt deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
  /prompts/{prompt_id}/reset:
    post:
      tags: [settings]
      operationId: resetPrompt
      parameters:
        - $ref: "#/components/parameters/PromptId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [baseRevision]
              properties:
                baseRevision: {type: integer, minimum: 1}
      responses:
        "200":
          description: Factory prompt reset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResource"}
  /model-catalog:
    post:
      tags: [settings]
      operationId: fetchModelCatalog
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderDiagnosticRequest"}
      responses:
        "200":
          description: Provider model catalog; result is not persisted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelCatalogResponse"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /connection-tests/{kind}:
    post:
      tags: [settings]
      operationId: runConnectionTest
      x-command-mode: transient
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - ollama
              - sakura
              - lama_repair
              - baidu_ocr
              - ai_vision_ocr
              - baidu_translate
              - youdao_translate
              - ai_translate
              - firecrawl
              - web_import_agent
              - vlm
              - llm
              - embedding
              - reranker
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderDiagnosticRequest"}
      responses:
        "200":
          description: Transient connection result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionTestResponse"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /fonts:
    get:
      tags: [settings]
      operationId: listFonts
      responses:
        "200":
          description: Built-in and uploaded backend fonts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FontList"}
    post:
      tags: [settings]
      operationId: uploadFont
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
                displayName: {type: string}
      responses:
        "201":
          description: Immutable font asset registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FontResource"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /fonts/{font_id}:
    delete:
      tags: [settings]
      operationId: deleteFont
      parameters:
        - name: font_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unreferenced uploaded font deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedResponse"}
        "409": {$ref: "#/components/responses/Conflict"}
  /maintenance/clean-temp:
    post:
      tags: [settings]
      operationId: cleanTemporaryAssets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Asset journal recovery result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovered]
                properties:
                  recovered: {type: integer, minimum: 0}
  /pages/{page_id}/repairs:
    post:
      tags: [operations]
      operationId: createPageRepairOperation
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BubbleRepairCommand"
                - $ref: "#/components/schemas/MaskSolidRepairCommand"
                - $ref: "#/components/schemas/MaskModelRepairCommand"
                - $ref: "#/components/schemas/MaskRestoreCommand"
      responses:
        "202":
          description: Repair operation was durably created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "422":
          $ref: "#/components/responses/ValidationError"
  /operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Current durable operation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/NotFound"
  /operations/{operation_id}/events:
    get:
      tags: [operations]
      operationId: getOperationEvents
      description: >-
        Returns durable catch-up events as JSON, or an SSE stream when the
        client sends Accept: text/event-stream or stream=1.
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - name: Last-Event-ID
          in: header
          schema: {type: integer, minimum: 0}
        - name: after
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 2000, default: 500}
        - name: stream
          in: query
          schema: {type: integer, enum: [0, 1], default: 0}
      responses:
        "200":
          description: Operation events or an event stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationEventList"}
            text/event-stream:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/NotFound"
  /pages/{page_id}/operations:
    post:
      tags: [operations]
      operationId: createPageOperation
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageOperationCommand"
      responses:
        "202":
          description: The operation was committed before returning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "423":
          $ref: "#/components/responses/Locked"
        "422":
          $ref: "#/components/responses/ValidationError"
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      parameters:
        - name: scope
          in: query
          schema: {type: string, enum: [queue, history], default: queue}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/JobStatus"}
        - name: type
          in: query
          schema: {$ref: "#/components/schemas/JobKind"}
        - name: book_id
          in: query
          schema: {$ref: "#/components/schemas/Uuid"}
        - name: limit
          in: query
          description: Maximum retained history batches; the live queue snapshot is always complete.
          schema: {type: integer, minimum: 1, maximum: 200, default: 200}
      responses:
        "200":
          description: Durable queue or retained history snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
  /jobs/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: integer, minimum: 0}
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
        - name: before
          in: query
          description: Return the preceding event page in ascending display order.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: One global resumable SSE stream for all job consumers.
          content:
            text/event-stream:
              schema: {type: string}
  /jobs/snapshot:
    get:
      tags: [jobs]
      operationId: getJobSnapshot
      description: Read the current UI projection for a bounded set of jobs.
      parameters:
        - name: job_id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: Current job rows, independent from the audit event stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobSnapshot"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job, item, step, checkpoint and error details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{job_id}/events:
    get:
      tags: [jobs]
      operationId: listJobEvents
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: after
          in: query
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        "200":
          description: Durable key-event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventList"
  /jobs/{job_id}/pause:
    post:
      tags: [jobs]
      operationId: pauseRunningJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Pause intent accepted or replayed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "409":
          $ref: "#/components/responses/InvalidTransition"
