  /plugin-agent/sessions/{session_id}/start:
    post:
      tags: [plugin-agent]
      operationId: startPluginAgentJob
      parameters:
        - $ref: "#/components/parameters/PluginAgentSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: Durable Plugin Agent job entered the global queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAgentStartResult"
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
components:
  parameters:
    PageId:
