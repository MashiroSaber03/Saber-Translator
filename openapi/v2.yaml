  /plugin-agent/sessions:
    post:
      tags: [plugin-agent]
      operationId: createPluginAgentSession
      x-command-mode: transient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginAgentSessionCreateCommand"
      responses:
        "201":
          description: An in-memory planning session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAgentSessionEnvelope"
        "422": {$ref: "#/components/responses/ValidationError"}
  /plugin-agent/sessions/{session_id}:
    get:
      tags: [plugin-agent]
      operationId: getPluginAgentSession
      parameters:
        - $ref: "#/components/parameters/PluginAgentSessionId"
      responses:
        "200":
          description: Current planning session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAgentSessionEnvelope"
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [plugin-agent]
      operationId: deletePluginAgentSession
      x-command-mode: transient
      parameters:
        - $ref: "#/components/parameters/PluginAgentSessionId"
      responses:
        "200":
          description: Planning memory deleted; any durable job continues.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [deleted]
                properties:
                  deleted: {type: boolean}
  /plugin-agent/sessions/{session_id}/messages:
    post:
      tags: [plugin-agent]
      operationId: sendPluginAgentPlanningMessage
      x-command-mode: transient
      parameters:
        - $ref: "#/components/parameters/PluginAgentSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Synchronous planning turn completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAgentSessionEnvelope"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /plugin-agent/sessions/{session_id}/lock-target:
    post:
      tags: [plugin-agent]
      operationId: lockPluginAgentTarget
      x-command-mode: transient
      parameters:
        - $ref: "#/components/parameters/PluginAgentSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposal]
              properties:
                proposal:
                  $ref: "#/components/schemas/PluginAgentTarget"
      responses:
        "200":
          description: New-plugin identity locked for this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAgentSessionEnvelope"
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /plugin-agent/sessions/{session_id}/start:
    post:
      tags: [plugin-agent]
      operationId: startPluginAgentJob
      parameters:
        - $ref: "#/components/parameters/PluginAgentSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "202":
          description: Durable Plugin Agent job entered the global queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAgentStartResult"
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
components:
  parameters:
    PageId:
      name: page_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BubbleId:
      name: bubble_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    BookId:
      name: book_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ChapterId:
      name: chapter_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DraftPageId:
      name: draft_page_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    NoteId:
      name: note_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CharacterId:
      name: character_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    FormId:
      name: form_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ImageVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BaseRevisionQuery:
      name: baseRevision
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    PromptId:
      name: prompt_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$"
    PluginAgentSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for this normalized command and target scope.
      schema:
        type: string
        minLength: 16
        maxLength: 200
  responses:
    Conflict:
      description: Revision, idempotency, or active-operation conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidTransition:
      description: The command is invalid for the current durable state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Locked:
      description: A chapter intent/lock or active task blocks the command.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Input failed the closed business schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderUnavailable:
      description: The selected external provider could not complete the diagnostic request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource does not exist or is no longer visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Uuid:
      type: string
      format: uuid
    RuntimeCapabilities:
      type: object
      additionalProperties: false
      required: [profile, requiresAuth, browserCredentials, registrationRequiresInvite, publicUserPolicy, scheduling, features]
      properties:
        profile: {type: string, enum: [local, public]}
        requiresAuth: {type: boolean}
        browserCredentials: {type: boolean}
        registrationRequiresInvite: {type: boolean}
        publicUserPolicy: {$ref: "#/components/schemas/PublicUserPolicy"}
        scheduling:
          type: object
          additionalProperties: false
          required: [maxDeepLearningConcurrency]
          properties:
            maxDeepLearningConcurrency:
              type: [integer, "null"]
              minimum: 1
              maximum: 8
        features:
          type: object
          additionalProperties: false
          required: [plugins, webImport, localProviders]
          properties:
            plugins: {type: boolean}
            webImport: {type: boolean}
            localProviders: {type: boolean}
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, username, role]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        username: {type: string, pattern: "^[a-z0-9_-]{3,32}$"}
        role: {type: string, enum: [user, admin]}
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, assetUsageBytes, assetQuotaBytes]
      properties:
        user: {$ref: "#/components/schemas/AuthUser"}
        csrfToken: {type: string}
        assetUsageBytes: {type: integer, minimum: 0}
        assetQuotaBytes: {type: integer, minimum: 1}
        recoveryCodes:
          type: array
          items: {type: string}
    LoginCommand:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 32}
        password: {type: string, minLength: 10, maxLength: 128}
    RegisterCommand:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 32}
        password: {type: string, minLength: 10, maxLength: 128}
        inviteCode: {type: string, minLength: 1}
    RecoverCommand:
      type: object
      additionalProperties: false
      required: [username, recoveryCode, newPassword]
      properties:
        username: {type: string, minLength: 3, maxLength: 32}
        recoveryCode: {type: string, minLength: 1}
        newPassword: {type: string, minLength: 10, maxLength: 128}
    ChangePasswordCommand:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128}
        newPassword: {type: string, minLength: 10, maxLength: 128}
    BrowserCredentialCommand:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties: {type: string, maxLength: 16384}
    BrowserCredentialLoaded:
      type: object
      additionalProperties: false
      required: [status, credentialReference]
      properties:
        status: {type: string, const: loaded}
        credentialReference: {type: string, pattern: "^browser:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+$"}
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, deleted]}
    AssetQuota:
      type: object
      additionalProperties: false
      required: [assetQuotaBytes]
      properties:
        assetQuotaBytes: {type: integer, minimum: 1}
    AdminQuotaCommand:
      type: object
      additionalProperties: false
      required: [assetQuotaBytes]
      properties:
        assetQuotaBytes: {type: integer, minimum: 1}
    RegistrationPolicy:
      type: object
      additionalProperties: false
      required: [registrationRequiresInvite]
      properties:
        registrationRequiresInvite: {type: boolean}
    PublicUserPolicy:
      type: object
      additionalProperties: false
      required: [features, models, settings]
      properties:
        features:
          type: object
          additionalProperties: false
          required: [translation, insight, characterStudio, editMode]
          properties:
            translation: {type: boolean}
            insight: {type: boolean}
            characterStudio: {type: boolean}
            editMode: {type: boolean}
        models:
          type: object
          additionalProperties: false
          required:
            - detector_default
            - detector_ctd
            - detector_yolo
            - aux_ysg_yolo
            - saber_yolo
            - manga_ocr
            - ocr_48px
            - paddle_ocr
            - paddleocr_vl
            - lama_mpe
            - litelama
          properties:
            detector_default: {type: boolean}
            detector_ctd: {type: boolean}
            detector_yolo: {type: boolean}
            aux_ysg_yolo: {type: boolean}
            saber_yolo: {type: boolean}
            manga_ocr: {type: boolean}
            ocr_48px: {type: boolean}
            paddle_ocr: {type: boolean}
            paddleocr_vl: {type: boolean}
            lama_mpe: {type: boolean}
            litelama: {type: boolean}
        settings:
          type: object
          additionalProperties: false
          required: [lamaDisableResize, parallel]
          properties:
            lamaDisableResize:
              type: object
              additionalProperties: false
              required: [editable, value]
              properties:
                editable: {type: boolean}
                value: {type: boolean}
            parallel:
              type: object
              additionalProperties: false
              required: [allowed]
              properties:
                allowed: {type: boolean}
    SchedulingPolicy:
      type: object
      additionalProperties: false
      required:
        - queueDiscipline
        - pageQuantum
        - interactiveBurst
        - maxDeepLearningConcurrency
        - apiOperationConcurrency
        - modelIdleSeconds
        - minAvailableMemoryMiB
      properties:
        queueDiscipline: {type: string, enum: [owner_round_robin, fifo]}
        pageQuantum: {type: integer, minimum: 1, maximum: 20}
        interactiveBurst: {type: integer, minimum: 0, maximum: 3}
        maxDeepLearningConcurrency: {type: integer, minimum: 1, maximum: 8}
