      type: object
      additionalProperties: false
      required: [continuationPageId, version, assetId]
      properties:
        continuationPageId: {$ref: "#/components/schemas/Uuid"}
        version: {type: integer, minimum: 1}
        assetId: {$ref: "#/components/schemas/Uuid"}
    WebImportSupportCommand:
      type: object
      additionalProperties: false
      required: [sourceUrl]
      properties:
        sourceUrl: {type: string, format: uri, maxLength: 8000}
    WebImportSupport:
      type: object
      additionalProperties: false
      required:
        [sourceUrl, galleryDlAvailable, galleryDlSupported, recommendedEngine]
      properties:
        sourceUrl: {type: string, format: uri}
        galleryDlAvailable: {type: boolean}
        galleryDlSupported: {type: boolean}
        recommendedEngine: {type: string, enum: [auto, gallery-dl]}
    WebImportDraftCreateCommand:
      type: object
      additionalProperties: false
      required: [chapterId, sourceUrl]
      properties:
        chapterId: {$ref: "#/components/schemas/Uuid"}
        sourceUrl: {type: string, format: uri, maxLength: 8000}
        engine:
          type: string
          enum: [auto, gallery-dl, ai-agent]
    WebImportDraftAccepted:
      allOf:
        - $ref: "#/components/schemas/JobBatchAccepted"
        - type: object
          required: [draftId]
          properties:
            draftId: {$ref: "#/components/schemas/Uuid"}
    WebImportDraftJob:
      type: object
      additionalProperties: false
      required: [id, kind, status]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        kind: {$ref: "#/components/schemas/JobKind"}
        status: {$ref: "#/components/schemas/JobStatus"}
    WebImportDraft:
      type: object
      additionalProperties: false
      required:
        - id
        - bookId
        - chapterId
        - status
        - revision
        - sourceUrl
        - requestedEngine
        - actualEngine
        - autoImport
        - candidateCount
        - selectedCount
        - failedCount
        - expiresAt
        - jobs
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        bookId: {$ref: "#/components/schemas/Uuid"}
        chapterId: {$ref: "#/components/schemas/Uuid"}
        status:
          type: string
          enum: [extracting, ready, committing, completed, failed, cancelled]
        revision: {type: integer, minimum: 1}
        sourceUrl: {type: string, format: uri}
        requestedEngine: {type: string, enum: [auto, gallery-dl, ai-agent]}
        actualEngine: {type: [string, "null"]}
        autoImport: {type: boolean}
        candidateCount: {type: integer, minimum: 0}
        selectedCount: {type: integer, minimum: 0}
        failedCount: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        jobs:
          type: array
          items: {$ref: "#/components/schemas/WebImportDraftJob"}
    WebImportDraftPage:
      type: object
      additionalProperties: false
      required:
        - id
        - ordinal
        - selected
        - sourceUrl
        - checksum
        - error
        - sourceMediaUrl
        - thumbnailUrl
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        ordinal: {type: integer, minimum: 1}
        selected: {type: boolean}
        sourceUrl: {type: string, format: uri}
        checksum: {type: [string, "null"]}
        error:
          type: [object, "null"]
          additionalProperties: true
        sourceMediaUrl: {type: [string, "null"]}
        thumbnailUrl: {type: [string, "null"]}
    WebImportDraftPageList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/WebImportDraftPage"}
        nextCursor: {type: [integer, "null"], minimum: 1}
    WebImportSelectionCommand:
      type: object
      additionalProperties: false
      required: [baseRevision, selectedPageIds]
      properties:
        baseRevision: {type: integer, minimum: 1}
        selectedPageIds:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/Uuid"}
    WebImportSelection:
      type: object
      additionalProperties: false
      required: [draftId, revision, selectedPageIds]
      properties:
        draftId: {$ref: "#/components/schemas/Uuid"}
        revision: {type: integer, minimum: 1}
        selectedPageIds:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/Uuid"}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - revision_conflict
            - idempotency_conflict
            - operation_active
            - invalid_job_transition
            - chapter_write_pending
            - chapter_locked
            - import_in_progress
            - session_busy
            - validation_error
            - not_found
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
