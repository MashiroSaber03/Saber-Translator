        ordinal: {type: integer, minimum: 1}
        role: {type: string, enum: [system, user, assistant]}
        content: {type: string}
        attachments:
          type: array
          items: {$ref: "#/components/schemas/StudioAttachment"}
    StudioChatSession:
      type: object
      additionalProperties: true
      required:
        [sessionId, documentId, indexRevision, revision, generation, archived, messages]
      properties:
        sessionId: {$ref: "#/components/schemas/Uuid"}
        documentId: {$ref: "#/components/schemas/Uuid"}
        indexRevision: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        generation: {type: integer, minimum: 1}
        archived: {type: boolean}
        messages:
          type: array
          items: {$ref: "#/components/schemas/StudioMessage"}
    StudioChatState:
      type: object
      additionalProperties: true
      required:
        [documentId, indexRevision, sessions, activeSession, availableGreetings]
      properties:
        documentId: {$ref: "#/components/schemas/Uuid"}
        indexRevision: {type: integer, minimum: 1}
        sessions:
          type: array
          items: {type: object, additionalProperties: true}
        activeSession:
          oneOf:
            - $ref: "#/components/schemas/StudioChatSession"
            - type: "null"
        availableGreetings:
          type: array
          items: {type: object, additionalProperties: true}
    StudioSessionIndexCommand:
      type: object
      additionalProperties: false
      required: [baseIndexRevision]
      properties:
        baseIndexRevision: {type: integer, minimum: 1}
    StudioSessionCreateCommand:
      type: object
      additionalProperties: false
      required: [baseIndexRevision]
      properties:
        baseIndexRevision: {type: integer, minimum: 1}
        title: {type: string, maxLength: 500}
        greetingId: {type: string}
        greeting: {type: string}
        greetingSource: {type: object, additionalProperties: true}
    StudioMessageCommand:
      type: object
      additionalProperties: false
      required: [baseSessionRevision]
      properties:
        baseSessionRevision:
          type: integer
          minimum: 1
        content:
          type: string
          maxLength: 100000
        assetIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
    StudioMessageEditCommand:
      type: object
      additionalProperties: false
      required: [baseSessionRevision, content]
      properties:
        baseSessionRevision: {type: integer, minimum: 1}
        content: {type: string, minLength: 1, maxLength: 100000}
    PluginAgentTarget:
      type: object
      additionalProperties: false
      required:
        [plugin_id, display_name, supported_steps, supported_modes]
      properties:
        plugin_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$"
        display_name: {type: string, minLength: 1, maxLength: 200}
        supported_steps:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              [job, pipeline, detect, ocr, color, translate, ai_translate, inpaint, render]
        supported_modes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [standard, hq, proofread, remove_text]
    PluginAgentLockedTarget:
      type: object
      additionalProperties: false
      required:
        - mode
        - plugin_dir
        - plugin_id
        - display_name
        - supported_steps
        - supported_modes
      properties:
        mode: {type: string, enum: [create, modify]}
        plugin_dir: {type: string}
        plugin_id: {type: string}
        display_name: {type: string}
        supported_steps:
          type: array
          items: {type: string}
        supported_modes:
          type: array
          items: {type: string}
    PluginAgentMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, timestamp]
      properties:
        id: {type: string}
        role: {type: string, enum: [user, assistant]}
        content: {type: string}
        timestamp: {type: string, format: date-time}
    PluginAgentEvent:
      type: object
      additionalProperties: false
      required: [id, type, payload, timestamp]
      properties:
        id: {type: integer, minimum: 1}
        type: {type: string}
        payload: {type: object, additionalProperties: true}
        timestamp: {type: string, format: date-time}
    PluginAgentSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - mode
        - run_state
        - messages
        - events
        - touched_files
        - file_previews
        - created_at
        - updated_at
      properties:
        session_id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        mode: {type: string, enum: [create, modify]}
        run_state:
          type: string
          enum:
            [drafting, awaiting_target_lock, ready, running, completed, failed, cancelled]
        selected_plugin_id: {type: [string, "null"]}
        pending_target:
          oneOf:
            - $ref: "#/components/schemas/PluginAgentTarget"
            - type: "null"
        locked_target:
          oneOf:
            - $ref: "#/components/schemas/PluginAgentLockedTarget"
            - type: "null"
        messages:
          type: array
          items: {$ref: "#/components/schemas/PluginAgentMessage"}
        events:
          type: array
          items: {$ref: "#/components/schemas/PluginAgentEvent"}
        touched_files:
          type: array
          items: {type: string}
        file_previews:
          type: object
          additionalProperties: {type: string}
        last_validation:
          type: [object, "null"]
          additionalProperties: true
        last_error: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        execution_started_at: {type: [string, "null"], format: date-time}
        execution_finished_at: {type: [string, "null"], format: date-time}
        job_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
    PluginAgentSessionEnvelope:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/PluginAgentSession"
    PluginAgentSessionCreateCommand:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [create, modify]}
        pluginId: {type: string}
      allOf:
        - if:
            properties:
              mode: {const: modify}
          then:
            required: [pluginId]
    PluginAgentStartResult:
      type: object
      additionalProperties: false
      required: [session, batchId, jobId]
      properties:
        session:
          $ref: "#/components/schemas/PluginAgentSession"
        batchId: {$ref: "#/components/schemas/Uuid"}
        jobId: {$ref: "#/components/schemas/Uuid"}
    PluginConfigField:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
          enum: [text, number, boolean, select]
        default: {}
        minimum: {type: number}
        maximum: {type: number}
        options:
          type: array
          items: {}
    PluginManifest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - plugin_id
        - display_name
        - package_version
        - entrypoint
        - hooks
        - supported_steps
        - supported_modes
        - priority
        - failure_policy
        - author
        - description
        - default_enabled
        - config_schema
      properties:
        schema_version: {type: integer, const: 3}
        plugin_id: {type: string}
        display_name: {type: string}
        package_version: {type: string}
        entrypoint: {type: string}
        hooks:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - before_job
              - after_job
              - before_pipeline
              - after_pipeline
              - before_detect
              - after_detect
              - before_ocr
              - after_ocr
              - before_color
              - after_color
              - before_translate
              - after_translate
              - before_ai_translate
              - after_ai_translate
              - before_inpaint
              - after_inpaint
              - before_render
              - after_render
        supported_steps:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - job
              - pipeline
              - detect
              - ocr
              - color
              - translate
              - ai_translate
              - inpaint
              - render
        supported_modes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [standard, hq, proofread, remove_text]
        priority: {type: integer, minimum: -10000, maximum: 10000}
        failure_policy: {type: string, enum: [continue, fail]}
        author: {type: string}
        description: {type: string}
        default_enabled: {type: boolean}
        config_schema:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PluginConfigField"
    Plugin:
      type: object
      additionalProperties: false
      required:
        - pluginId
        - displayName
        - author
        - description
        - state
        - defaultEnabled
        - runtimeEnabled
        - config
        - configRevision
        - pluginVersionId
        - packageVersion
        - currentRevision
        - manifest
        - configSchema
      properties:
        pluginId: {type: string}
        displayName: {type: string}
        author: {type: string}
        description: {type: string}
        state: {type: string, enum: [enabled, disabled, error]}
        defaultEnabled: {type: boolean}
        runtimeEnabled: {type: boolean}
        config: {type: object, additionalProperties: true}
        configRevision: {type: integer, minimum: 1}
        errorMessage: {type: [string, "null"]}
        pluginVersionId: {$ref: "#/components/schemas/Uuid"}
        packageVersion: {type: string}
        currentRevision: {type: integer, minimum: 1}
        manifest: {$ref: "#/components/schemas/PluginManifest"}
        configSchema:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PluginConfigField"
    PluginList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Plugin"}
    PluginConfig:
      type: object
      additionalProperties: false
      required: [pluginId, schema, value, configRevision]
      properties:
        pluginId: {type: string}
        schema:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PluginConfigField"
        value: {type: object, additionalProperties: true}
        configRevision: {type: integer, minimum: 1}
    PluginConfigCommand:
      type: object
      additionalProperties: false
      required: [baseRevision, config]
      properties:
        baseRevision: {type: integer, minimum: 1}
        config: {type: object, additionalProperties: true}
    PluginEnabledCommand:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    PluginImportResult:
      type: object
      additionalProperties: false
      required:
        [pluginId, pluginVersionId, packageVersion, currentRevision]
      properties:
        pluginId: {type: string}
        pluginVersionId: {$ref: "#/components/schemas/Uuid"}
        packageVersion: {type: string}
        currentRevision: {type: integer, minimum: 1}
    PluginRefreshResult:
      type: object
      additionalProperties: false
      required: [checkedVersions, failedVersions]
      properties:
        checkedVersions: {type: integer, minimum: 0}
        failedVersions: {type: integer, minimum: 0}
    PluginDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted, pluginId]
      properties:
        deleted: {type: boolean, const: true}
        pluginId: {type: string}
    Book:
      type: object
      additionalProperties: false
      required: [id, title, chapterOrderRevision]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        title: {type: string}
        chapterOrderRevision: {type: integer, minimum: 1}
        coverAssetUrl: {type: [string, "null"]}
        chapterCount: {type: integer, minimum: 0}
        pageCount: {type: integer, minimum: 0}
        tags:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, color]
            properties:
              id: {$ref: "#/components/schemas/Uuid"}
              name: {type: string}
              color: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BookList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Book"}
    Chapter:
      type: object
      additionalProperties: false
      required: [id, ordinal, title, pageOrderRevision]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        bookId: {$ref: "#/components/schemas/Uuid"}
        ordinal: {type: integer, minimum: 1}
        title: {type: string}
        pageCount: {type: integer, minimum: 0}
        pageOrderRevision: {type: integer, minimum: 1}
    ChapterList:
      type: object
      additionalProperties: false
      required: [book, chapters]
      properties:
        book:
          type: object
          additionalProperties: true
        chapters:
          type: array
          items: {$ref: "#/components/schemas/Chapter"}
    PageSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - chapterId
        - ordinal
        - logicalSourcePath
        - sourceRevision
        - documentRevision
        - sourceUrl
        - thumbnailSourceUrl
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        chapterId: {$ref: "#/components/schemas/Uuid"}
        ordinal: {type: integer, minimum: 1}
        logicalSourcePath: {type: string}
        sourceRevision: {type: integer, minimum: 1}
        documentRevision: {type: integer, minimum: 1}
        renderedRevision: {type: [integer, "null"], minimum: 1}
        renderStatus: {type: string}
        detectionState: {type: string}
        sourceUrl: {type: string}
        thumbnailSourceUrl: {type: string}
        cleanUrl: {type: [string, "null"]}
        translatedUrl: {type: [string, "null"]}
        thumbnailTranslatedUrl: {type: [string, "null"]}
        width: {type: [integer, "null"], minimum: 1}
        height: {type: [integer, "null"], minimum: 1}
    PageList:
      type: object
      additionalProperties: false
      required: [items, nextCursor, pageOrderRevision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PageSummary"}
        nextCursor: {type: [integer, "null"], minimum: 1}
        pageOrderRevision: {type: integer, minimum: 1}
    PageImportResult:
      type: object
      additionalProperties: false
      required: [page, pageOrderRevision]
      properties:
        page: {$ref: "#/components/schemas/PageSummary"}
        pageOrderRevision: {type: integer, minimum: 1}
    ImportLease:
      type: object
      additionalProperties: false
      required: [leaseId, ownerToken, expiresAt]
      properties:
        leaseId: {$ref: "#/components/schemas/Uuid"}
        ownerToken: {type: string, minLength: 32}
        expiresAt: {type: string, format: date-time}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - revision_conflict
            - idempotency_conflict
            - operation_active
            - invalid_job_transition
            - chapter_write_pending
            - chapter_locked
            - import_in_progress
            - session_busy
            - validation_error
            - not_found
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
