      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$"
    PluginAgentSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    ImportLeaseId:
      name: Import-Lease-Id
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ImportLeaseToken:
      name: Import-Lease-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for this normalized command and target scope.
      schema:
        type: string
        minLength: 16
        maxLength: 200
  responses:
    Conflict:
      description: Revision, idempotency, or active-operation conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidTransition:
      description: The command is invalid for the current durable state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Locked:
      description: A chapter intent/lock, import lease, or active task blocks the command.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Input failed the closed business schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource does not exist or is no longer visible.
